name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # A new compiler warning fails the build here (#45); see build.sh.
      - run: ./test.sh
        env:
          YORU_WERROR: '1'
